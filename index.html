  <style>
    :root {
      --padi: #1f5a34;
      --padi-gelap: #123a21;
      --daun: #e3f1de;
      --emas: #f2b632;
      --tanah: #fbfaf5;
      --teks: #17311f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Figtree', Arial, sans-serif;
      color: var(--teks);
      background-color: var(--daun);
      /* coretan sapi, ayam, padi, wortel */
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%20viewBox%3D%270%200%20180%20180%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke%3D%27rgb%2831%2C90%2C52%29%27%20stroke-opacity%3D%27.17%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%0A%3Cpath%20d%3D%27M22%2030q-9-6-13%200%204%209%2013%205%27%2F%3E%3Cpath%20d%3D%27M58%2030q9-6%2013%200-4%209-13%205%27%2F%3E%0A%3Crect%20x%3D%2722%27%20y%3D%2722%27%20width%3D%2736%27%20height%3D%2736%27%20rx%3D%2715%27%2F%3E%3Crect%20x%3D%2727%27%20y%3D%2742%27%20width%3D%2726%27%20height%3D%2716%27%20rx%3D%278%27%2F%3E%0A%3Ccircle%20cx%3D%2735%27%20cy%3D%2750%27%20r%3D%271.2%27%2F%3E%3Ccircle%20cx%3D%2745%27%20cy%3D%2750%27%20r%3D%271.2%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2735%27%20r%3D%271.2%27%2F%3E%3Ccircle%20cx%3D%2748%27%20cy%3D%2735%27%20r%3D%271.2%27%2F%3E%0A%3Ccircle%20cx%3D%27130%27%20cy%3D%2746%27%20r%3D%2716%27%2F%3E%3Cpath%20d%3D%27M123%2031q2-9%206-2%202-9%207-1%27%2F%3E%3Cpath%20d%3D%27M146%2044l9%203-9%203%27%2F%3E%3Ccircle%20cx%3D%27126%27%20cy%3D%2742%27%20r%3D%271.2%27%2F%3E%0A%3Cpath%20d%3D%27M40%20165V112%27%2F%3E%3Cpath%20d%3D%27M40%20128q-11-4-13-13%2011%200%2013%2013M40%20128q11-4%2013-13-11%200-13%2013M40%20144q-11-4-13-13%2011%200%2013%2013M40%20144q11-4%2013-13-11%200-13%2013%27%2F%3E%3Cpath%20d%3D%27M40%20112q-5-9%200-16%205%207%200%2016%27%2F%3E%0A%3Cpath%20d%3D%27M120%20118h26l-13%2042z%27%2F%3E%3Cpath%20d%3D%27M133%20118q-7-13-2-17M133%20118q0-14%204-17M133%20118q7-11%2013-10%27%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E");
      background-size: 180px 180px;
    }
    header {
      position: relative;
      overflow: hidden;
      background: var(--padi-gelap);
      color: #fff;
      text-align: center;
      padding: 48px 20px 64px;
      border-bottom: 8px solid var(--emas);
    }
    .awan { position: absolute; animation: lewat 60s linear infinite; }
    .a1 { top: 18px; left: -140px; }
    .a2 { top: 70px; left: -140px; animation-duration: 90s; animation-delay: -35s; }
    @keyframes lewat { to { transform: translateX(calc(100vw + 300px)); } }
    @media (prefers-reduced-motion: reduce) { .awan { animation: none; left: 12%; } }
    .lambang { position: relative; display: block; margin: 0 auto 16px; }
    h1 {
      position: relative;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 9vw, 64px);
      letter-spacing: .04em;
      margin: 0;
    }
    header p { position: relative; margin: 8px 0 0; font-size: 17px; opacity: .85; }
    main { position: relative; z-index: 1; max-width: 520px; margin: -32px auto 0; padding: 0 16px 230px; }
    .daftar { display: grid; gap: 12px; }
    a.item {
      display: flex; align-items: center; gap: 16px;
      background: var(--tanah);
      color: var(--teks);
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 14px;
      border-left: 8px solid var(--padi);
      box-shadow: 0 2px 0 rgba(18,58,33,.14);
      transition: transform .15s, border-color .15s, background .15s;
    }
    a.item:hover, a.item:focus-visible {
      transform: translateX(6px);
      border-left-color: var(--emas);
      background: #fff;
      outline: none;
    }
    a.item:focus-visible { box-shadow: 0 0 0 3px var(--emas); }
    .tahun {
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      font-weight: 800;
      font-size: 30px;
      color: var(--padi);
      min-width: 86px;
    }
    .ket { flex: 1; }
    .ket strong { display: block; font-size: 17px; }
    .ket span { font-size: 14px; opacity: .7; }
    .ikon { flex: none; color: var(--padi); }
    /* pemandangan ladang di dasar halaman */
    .ladang {
      position: fixed; left: 0; bottom: 0;
      width: 100%; height: 200px;
      z-index: 0; pointer-events: none;
    }
    footer {
      position: fixed; z-index: 2; left: 0; right: 0; bottom: 6px;
      text-align: center; font-size: 13px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 2px rgba(18,58,33,.6);
    }
  </style>
</head>
