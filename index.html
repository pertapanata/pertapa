      background-size: 180px 180px;

    header {
      position: relative;
      overflow: hidden;
      background: var(--padi-gelap);
      color: #fff;
      text-align: center;
      padding: 48px 20px 64px;
      border-bottom: 8px solid var(--emas);
    }
    .awan { position: absolute; animation: lewat 60s linear infinite; }
    .a1 { top: 18px; left: -140px; }
    .a2 { top: 70px; left: -140px; animation-duration: 90s; animation-delay: -35s; }
    @keyframes lewat { to { transform: translateX(calc(100vw + 300px)); } }
    @media (prefers-reduced-motion: reduce) { .awan { animation: none; left: 12%; } }
    .lambang { position: relative; display: block; width: 112px; height: 112px; margin: 0 auto 12px; }
    h1 {
      position: relative;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 9vw, 64px);
      letter-spacing: .04em;
      margin: 0;
    }
    h1 .petani { width: .95em; height: .95em; vertical-align: -.12em; margin-right: .1em; }
    header p { position: relative; margin: 8px 0 0; font-size: 17px; opacity: .85; }
    main { position: relative; z-index: 1; max-width: 520px; margin: -32px auto 0; padding: 0 16px 230px; }
    .daftar { display: grid; gap: 12px; }
    .item {
      display: flex; align-items: center; gap: 16px;
      width: 100%; border: 0; font: inherit; text-align: left; cursor: pointer;
      background: var(--tanah);
      color: var(--teks);
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 14px;
      border-left: 8px solid var(--padi);
      box-shadow: 0 2px 0 rgba(18,58,33,.14);
      transition: transform .15s, border-color .15s, background .15s;
    }
    .item:hover, .item:focus-visible {
      transform: translateX(6px);
      border-left-color: var(--emas);
      background: #fff;
      outline: none;
    }
    .item:focus-visible { box-shadow: 0 0 0 3px var(--emas); }
    .tahun {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      font-weight: 800;
      font-size: 30px;
      color: var(--padi);
      min-width: 112px;
    }
    .ket { flex: 1; }
    .ket strong { display: block; font-size: 17px; }
    .ket span { font-size: 14px; opacity: .7; }
    .ikon { flex: none; color: var(--padi); }

    /* ikon SVG */
    .ic { width: 1.1em; height: 1.1em; vertical-align: -.2em; flex: none; }
    .tahun .ic { width: .95em; height: .95em; vertical-align: 0; }
    .ket .ic { width: 1.15em; height: 1.15em; }

    /* panah & submenu */
    .panah { transition: transform .2s; }
    .item[aria-expanded="true"] .panah { transform: rotate(180deg); }
    .item[aria-expanded="true"] { border-left-color: var(--emas); background: #fff; }
    .submenu { display: grid; gap: 8px; margin: 8px 0 4px 20px; }
    .submenu[hidden] { display: none; }
    .submenu a, .submenu .info {
      display: block; padding: 12px 16px; border-radius: 10px;
      background: #fff; color: var(--teks); text-decoration: none;
      border-left: 5px solid var(--emas); font-weight: 600; font-size: 15px;
    }
    .submenu a { display: flex; align-items: center; gap: 10px; }
    .submenu a .ic { width: 22px; height: 22px; vertical-align: 0; }
    .submenu a:hover, .submenu a:focus-visible { background: var(--daun); outline: none; }
    .submenu a.utama { border-left-color: var(--padi); color: var(--padi); }
    .submenu .info { font-weight: 400; opacity: .7; border-left-color: transparent; }

    /* papan pengumuman gantung di pojok atas */
    .gantung {
      position: absolute; top: 0; right: 18px; z-index: 3;
      width: min(240px, 46vw);
    }
    .gantung.kiri { right: auto; left: 18px; }
    .ayun {
      position: relative; padding-top: 34px;
      transform-origin: 50% 0;
      animation: ayun 4s ease-in-out infinite alternate;
      cursor: pointer;
    }
    .ayun.tuing { animation: tuing 1.8s ease-out; }
    .tali {
      position: absolute; top: 0; height: 44px; width: 4px; border-radius: 2px;
      background: repeating-linear-gradient(45deg, #b08d57 0 3px, #8a6a3f 3px 6px);
    }
    .tali::before {
      content: ""; position: absolute; top: -3px; left: -3px;
      width: 10px; height: 10px; border-radius: 50%; background: #3b2412;
    }
    .tali.t1 { left: 20%; }
    .tali.t2 { right: 20%; }
    @keyframes ayun { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes tuing {
      0%   { transform: rotate(0); }
      15%  { transform: rotate(14deg); }
      35%  { transform: rotate(-10deg); }
      55%  { transform: rotate(6deg); }
      75%  { transform: rotate(-3deg); }
      100% { transform: rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .ayun, .ayun.tuing { animation: none; } }
    .kayu {
      position: relative; z-index: 1;
      padding: 18px 20px 20px;
      color: #3b2412;
      border: 4px solid #5a3a1d;
      border-radius: 10px;
      background:
        radial-gradient(circle at 13px 13px, #2e1c0d 0 3px, transparent 4px),
        radial-gradient(circle at calc(100% - 13px) 13px, #2e1c0d 0 3px, transparent 4px),
        radial-gradient(circle at 13px calc(100% - 13px), #2e1c0d 0 3px, transparent 4px),
        radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), #2e1c0d 0 3px, transparent 4px),
        repeating-linear-gradient(180deg, #c99a62 0 38px, #b07f48 38px 40px);
      box-shadow: 0 3px 0 rgba(18,58,33,.25);
    }
    .kayu h2 {
      margin: 0 0 10px; text-align: center;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      font-weight: 800; font-size: 20px; letter-spacing: .06em;
      color: #3b2412;
    }
    .kertas {
      background: var(--tanah);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 15px; line-height: 1.5;
      box-shadow: 0 2px 0 rgba(59,36,18,.25);
    }
    .kertas p { margin: 0; }
    .kertas p + p { margin-top: 8px; }
    @media (max-width: 1000px) {
      .gantung { width: 150px; right: 10px; }
      .gantung.kiri { left: 10px; }
      .kayu { padding: 10px 10px 12px; }
      .kayu h2 { font-size: 13px; margin-bottom: 6px; }
      .kertas { font-size: 12px; padding: 8px 9px; }
    }

    /* pemandangan ladang di dasar halaman */
    .ladang {
      position: fixed; left: 0; bottom: 0;
      width: 100%; height: 200px;
      z-index: 0; pointer-events: none;
    }
    footer {
      position: fixed; z-index: 2; left: 0; right: 0; bottom: 6px;
      text-align: center; font-size: 13px; font-weight: 600; color: #fff;
      text-shadow: 0 1px 2px rgba(18,58,33,.6);
    }
  </style>
</head>

  <script>
    // URL Web app dari Apps Script (berakhiran /exec)
    const API = 'https://script.google.com/macros/s/AKfycbx5WRLbslA9nf9vB-RCwOzPBYRwYZHHAJIrm--8kAY7vYIp_hsWkWsa_igoSn2hyGkv/exec';

    const TAHUN = [
      { t: 2023, id: '10Vc0UO37VgGEzRsfqPTTFy-Ye8mPXN4T' },
      { t: 2024, id: '1Kssm38uSy5EKWE0besSKQMNAzQGKfS89' },
      { t: 2025, id: '1kzXcMSt7lbH-NO_YygssvOT3CsjCvZz1' },
      { t: 2026, id: '14peh0Rnb35uK0zpumWkyne3C7i3IeTv6' },
      { t: 2027, id: '1PGuYWqgiWXJ8zkZAm9M7oUM5oSIUhskx' },
      { t: 2028, id: '1D2JGsVmpBBAHQNbqQ2Qq4_EtlL1NLxLB' }
    ];

    // papan gantung: goyang "tuing" saat disentuh atau diklik
    const ayun = document.getElementById('ayun');
    function tuing() {
      if (ayun.classList.contains('tuing')) return;
      ayun.classList.add('tuing');
      ayun.addEventListener('animationend', () => ayun.classList.remove('tuing'), { once: true });
    }
    ayun.addEventListener('mouseenter', tuing);
    ayun.addEventListener('click', tuing);

    const daftar = document.getElementById('daftar');
    const cache = {};

    function buatLink(teks, href, kelas, ikon) {
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      if (kelas) a.className = kelas;
      a.innerHTML = `<svg class="ic" aria-hidden="true"><use href="#${ikon}"/></svg>`;
      const s = document.createElement('span');
      s.textContent = teks;
      a.append(s);
      return a;
    }
    function buatInfo(teks) {
      const d = document.createElement('div');
      d.className = 'info';
      d.textContent = teks;
      return d;
    }

    async function muat(id, panel, urlUtama) {
      panel.replaceChildren(buatInfo('Memuat folder…'));
      try {
        if (!cache[id]) {
          const r = await fetch(`${API}?id=${id}`);
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          cache[id] = j.folders;
        }
        panel.replaceChildren(buatLink('Buka folder utama', urlUtama, 'utama', 'i-folder-buka'));
        cache[id].forEach(f => panel.append(buatLink(f.name, f.url, '', 'i-folder')));
        if (!cache[id].length) panel.append(buatInfo('Belum ada subfolder.'));
      } catch (e) {
        panel.replaceChildren(
          buatInfo('Gagal memuat daftar folder.'),
          buatLink('Buka folder utama', urlUtama, 'utama', 'i-folder-buka')
        );
      }
    }

    TAHUN.forEach(({ t, id }) => {
      const urlUtama = `https://drive.google.com/drive/folders/${id}?usp=drive_link`;
      const grup = document.createElement('div');
      grup.innerHTML = `
        <button class="item" type="button" aria-expanded="false">
          <span class="tahun">${t}<svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg></span>
          <span class="ket"><strong><svg class="ic" aria-hidden="true"><use href="#i-tunas"/></svg> Dokumen Perencanaan <svg class="ic" aria-hidden="true"><use href="#i-sapi"/></svg></strong></span>
          <svg class="ikon panah" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="submenu" hidden></div>`;
      const tombol = grup.querySelector('.item');
      const panel = grup.querySelector('.submenu');

      tombol.addEventListener('click', () => {
        const buka = panel.hidden;
        panel.hidden = !buka;
        tombol.setAttribute('aria-expanded', buka);
        if (buka && !panel.hasChildNodes()) muat(id, panel, urlUtama);
      });
      daftar.append(grup);
    });
  </script>
